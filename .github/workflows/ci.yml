name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Validar HTML e CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  lighthouse:
    name: Lighthouse (meta 90+)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx @lhci/cli@0.14 autorun
